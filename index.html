<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FocusGuard - AI 자세 교정 &amp; 순공 PiP 스터디</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --border: #1f2a44;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --neon: #4ade80;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .app-shell {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 10px var(--neon);
    }
    .engine-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-weight: 600;
    }
    .stage-card {
      position: relative;
      background: #060911;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#hudCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    video#rawVideo {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .placeholder-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: radial-gradient(circle at center, #11192c 0%, #060911 100%);
      text-align: center;
      padding: 20px;
      z-index: 5;
    }
    .placeholder-overlay.hidden { display: none; }

    /* 거북목 감지 시 화면 전체 어두워짐(Dimming) 오버레이 (iPadOS Safari 완벽 호환) */
    .screen-dim-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(0, 0, 0, 0);
      pointer-events: none;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background 0.35s ease, opacity 0.35s ease;
      opacity: 0;
      text-align: center;
      padding: 24px;
    }
    .screen-dim-overlay.warn {
      background: rgba(0, 0, 0, 0.48);
      opacity: 1;
    }
    .screen-dim-overlay.bad {
      background: rgba(0, 0, 0, 0.86);
      opacity: 1;
    }
